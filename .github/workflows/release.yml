name: Build and Release

on:
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build:
        strategy:
            matrix:
                include:
                    - os: windows-latest
                      archive: trigger-windows-amd64.zip
                    - os: ubuntu-latest
                      archive: trigger-linux-amd64.tar.gz
                    - os: macos-latest
                      archive: trigger-macos-arm64.zip
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v7

            - uses: dtolnay/rust-toolchain@stable

            - name: Install dependencies
              if: runner.os == 'Linux'
              run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libclang-dev libasound2-dev libssl-dev libx11-dev libx11-xcb-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libxdo-dev libgtk-3-dev libayatana-appindicator3-dev libpipewire-0.3-dev libspa-0.2-dev libgbm-dev libwayland-dev libegl-dev

            - name: Build
              run: cargo build --release

            - name: Package (Windows)
              if: runner.os == 'Windows'
              run: Compress-Archive -Path target/release/trigger.exe, README.md, LICENSE -DestinationPath ${{ matrix.archive }}

            - name: Package (Linux)
              if: runner.os == 'Linux'
              run: |
                  mkdir -p pkg/trigger-linux-amd64
                  cp target/release/trigger pkg/trigger-linux-amd64/
                  cp README.md LICENSE packaging/linux/trigger.desktop pkg/trigger-linux-amd64/
                  cp assets/icon.png pkg/trigger-linux-amd64/trigger.png
                  tar -czf ${{ matrix.archive }} -C pkg trigger-linux-amd64

            - name: Package (macOS)
              if: runner.os == 'macOS'
              run: |
                  sh packaging/macos/package.sh
                  cd target && ditto -c -k --sequesterRsrc --keepParent trigger.app ../${{ matrix.archive }}

            - uses: actions/upload-artifact@v7
              with:
                  name: ${{ matrix.archive }}
                  path: ${{ matrix.archive }}

    release:
        needs: build
        runs-on: ubuntu-slim
        steps:
            - uses: actions/download-artifact@v8
              with:
                  path: dist
                  merge-multiple: true

            - uses: softprops/action-gh-release@v3
              with:
                  tag_name: build-${{ github.run_number }}
                  name: build-${{ github.run_number }}
                  files: dist/*
