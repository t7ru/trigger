[package]
name = "trigger"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = "0.2.2"
global-hotkey = "0.8"
tray-icon = "0.24"
xcap = "0.9"
base64 = "0.22"
image = "0.25"
reqwest = { version = "0.12", features = ["blocking", "json", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
directories = "6"
seq-macro = "0.3.6"
cpal = "0.18"
hound = "3"
raw-window-handle = "0.6"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[target.'cfg(not(windows))'.dependencies]
enigo = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
